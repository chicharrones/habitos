name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App Bundle (Simulator Unsigned)
        run: flutter build ios --simulator

      - name: Build iOS App Bundle (Physical Device Unsigned)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/ios \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPEC=""

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r habitos_ios_app.ipa Payload
          cd build/ios/iphonesimulator
          zip -r ../../../habitos_ios_simulator.zip Runner.app

      - name: Upload iOS App IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitos-ios-app
          path: habitos_ios_app.ipa

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitos-ios-simulator
          path: habitos_ios_simulator.zip
